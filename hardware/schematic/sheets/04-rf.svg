.8" fill="black" font-size="9.5" font-family="sans" text-anchor="start"><tspan x="347.40000000000003" dy="9.5">VIN</tspan></text><text x="552.6" y="-83.0" fill="black" font-size="9.5" font-family="sans" text-anchor="end"><tspan x="552.6" dy="9.5">SHUT</tspan></text><text x="552.6" y="-140.59999999999997" fill="black" font-size="9.5" font-family="sans" text-anchor="end"><tspan x="552.6" dy="9.5">DATA</tspan></text><text x="450.0" y="-171.0" fill="black" font-size="9.5" font-family="sans" text-anchor="middle"><tspan x="450.0" dy="9.5">ANT</tspan></text><text x="450.0" y="-52.599999999999994" fill="black" font-size="9.5" font-family="sans" text-anchor="middle"><tspan x="450.0" dy="9.5">GND</tspan></text><text x="453.59999999999997" y="-130.6" fill="black" font-size="9.5" font-family="sans" text-anchor="middle"><tspan x="453.59999999999997" dy="9.5">U5</tspan><tspan x="453.59999999999997" dy="9.5">RXB61</tspan><tspan x="453.59999999999997" dy="9.5">433.92 MHz</tspan><tspan x="453.59999999999997" dy="9.5">receiver module</tspan></text><text x="482.40000000000003" y="-274.40000000000003" fill="black" font-size="8" font-family="sans" text-anchor="start"><tspan x="482.40000000000003" dy="8">E1 / J4: 17.3 cm wire (1/4 wave) or</tspan><tspan x="482.40000000000003" dy="8">SMA edge jack + 433 MHz whip</tspan></text><text x="657.0" y="-168.39999999999998" fill="black" font-size="9.5" font-family="sans" text-anchor="middle"><tspan x="657.0" dy="9.5">R10</tspan><tspan x="657.0" dy="9.5">10k</tspan></text><text x="750.6" y="-101.3" fill="black" font-size="9.5" font-family="sans" text-anchor="start"><tspan x="750.6" dy="9.5">R11</tspan><tspan x="750.6" dy="9.5">20k</tspan></text><text x="838.368" y="-140.2" fill="black" font-size="8.5" font-family="sans" text-anchor="middle"><tspan x="838.368" dy="8.5">RF_DATA</tspan></text><text x="817.1999999999999" y="-111.6" fill="black" font-size="8" font-family="sans" text-anchor="start"><tspan x="817.1999999999999" dy="8">5 V -&gt; 3.33 V level shift</tspan><tspan x="817.1999999999999" dy="8">(ESP32 GPIOs are not 5 V tolerant)</tspan></text><text x="666.0" y="-38.30000000000001" fill="black" font-size="9.5" font-family="sans" text-anchor="start"><tspan x="666.0" dy="9.5">JP1</tspan><tspan x="666.0" dy="9.5">1-2 default</tspan></text><text x="631.8000000000001" y="5.999999999999989" fill="black" font-size="7.5" font-family="sans" text-anchor="end"><tspan x="631.8000000000001" dy="7.5">1</tspan></text><text x="631.8000000000001" y="-69.60000000000001" fill="black" font-size="7.5" font-family="sans" text-anchor="end"><tspan x="631.8000000000001" dy="7.5">3</tspan></text><text x="648.0" y="-119.20000000000002" fill="black" font-size="9.5" font-family="sans" text-anchor="middle"><tspan x="648.0" dy="9.5">+5V_RF</tspan></text><text x="628.5929999999998" y="114.83999999999997" fill="black" font-size="11" font-family="sans" text-anchor="start"><tspan x="628.5929999999998" dy="11">ENTRIX door controller</tspan><tspan x="628.5929999999998" dy="11">433 MHz receiver RXB61</tspan></text><text x="628.5929999999998" y="183.95999999999998" fill="black" font-size="8.5" font-family="sans" text-anchor="start"><tspan x="628.5929999999998" dy="8.5">Sheet 4 of 9   Rev A (draft)   2026-11-01</tspan></text><text x="-37.407" y="114.83999999999997" fill="black" font-size="8.5" font-family="sans" text-anchor="start"><tspan x="-37.407" dy="8.5">NOTES</tspan><tspan x="-37.407" dy="8.5">1. RXB61 has 5 pins: VIN, GND, DATA, ANT, SHUT. No official datasheet was found: confirm the pin order on your module's silkscreen</tspan><tspan x="-37.407" dy="8.5">   before PCB layout, and check the SHUT polarity (JP1 1-2 = SHUT to GND = receiver ON for active-high shutdown; use 2-3 if your module is active-low).</tspan><tspan x="-37.407" dy="8.5">2. RXB6 / RXB12 / SRX882 can be used instead: same VIN, GND, DATA and ANT signals, different footprint (no SHUT pin -&gt; leave JP1 open).</tspan><tspan x="-37.407" dy="8.5">3. Order the 433.92 MHz version (315 MHz in North America). Keep the receiver and its antenna away from the XL7015 (L1, D3) and relay K1.</tspan><tspan x="-37.407" dy="8.5">4. Supply is 5 V for best sensitivity; R12/C12 filter the buck ripple. DATA is divided to 3.3 V by R10/R11.</tspan></text><circle cx="126.0" cy="-108.0" r="3.2399999999999998" style="stroke:black;fill:black;stroke-width:1.3;" /><circle cx="216.0" cy="-108.0" r="3.2399999999999998" style="stroke:black;fill:black;stroke-width:1.3;" /><circle cx="738.0" cy="-136.79999999999998" r="3.2399999999999998" style="stroke:black;fill:black;stroke-width:1.3;" /></svg>