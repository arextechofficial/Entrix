chor="middle"><tspan x="576.0" dy="9.5">+5V</tspan></text><text x="599.3999018989854" y="-41.24999999999999" fill="black" font-size="9.5" font-family="sans" text-anchor="start"><tspan x="599.3999018989854" dy="9.5">BZ1</tspan><tspan x="599.3999018989854" dy="9.5">active buzzer</tspan><tspan x="599.3999018989854" dy="9.5">5 V 12x9.5 mm</tspan></text><text x="586.8000000000001" y="-61.199999999999996" fill="black" font-size="9" font-family="sans" text-anchor="start"><tspan x="586.8000000000001" dy="9">+</tspan></text><text x="473.40000000000003" y="-36.5" fill="black" font-size="9.5" font-family="sans" text-anchor="end"><tspan x="473.40000000000003" dy="9.5">D10</tspan><tspan x="473.40000000000003" dy="9.5">1N4148W</tspan></text><text x="588.6" y="68.39999999999999" fill="black" font-size="9.5" font-family="sans" text-anchor="start"><tspan x="588.6" dy="9.5">Q3</tspan><tspan x="588.6" dy="9.5">AO3400A</tspan></text><text x="496.2" y="107.5" fill="black" font-size="9.5" font-family="sans" text-anchor="start"><tspan x="496.2" dy="9.5">R29</tspan><tspan x="496.2" dy="9.5">10k</tspan></text><text x="438.6" y="49.39999999999999" fill="black" font-size="9.5" font-family="sans" text-anchor="middle"><tspan x="438.6" dy="9.5">R28</tspan><tspan x="438.6" dy="9.5">100R</tspan></text><text x="367.35600000000005" y="77.60000000000001" fill="black" font-size="8.5" font-family="sans" text-anchor="middle"><tspan x="367.35600000000005" dy="8.5">BUZZER</tspan></text><text x="475.20000000000005" y="413.79999999999995" fill="black" font-size="11" font-family="sans" text-anchor="start"><tspan x="475.20000000000005" dy="11">ENTRIX door controller</tspan><tspan x="475.20000000000005" dy="11">LEDs and buzzer</tspan></text><text x="475.20000000000005" y="478.6" fill="black" font-size="8.5" font-family="sans" text-anchor="start"><tspan x="475.20000000000005" dy="8.5">Sheet 8 of 9   Rev A (draft)   2026-11-01</tspan></text><text x="-190.79999999999998" y="413.79999999999995" fill="black" font-size="8.5" font-family="sans" text-anchor="start"><tspan x="-190.79999999999998" dy="8.5">NOTES</tspan><tspan x="-190.79999999999998" dy="8.5">1. Green = access granted, red = denied / tamper, alternating = admin mode. The buzzer gives a short beep on every remote press.</tspan><tspan x="-190.79999999999998" dy="8.5">2. Use an ACTIVE buzzer (built-in oscillator): the firmware only switches it on and off.</tspan></text><circle cx="576.0" cy="-72.0" r="3.2399999999999998" style="stroke:black;fill:black;stroke-width:1.3;" /><circle cx="576.0" cy="18.0" r="3.2399999999999998" style="stroke:black;fill:black;stroke-width:1.3;" /><circle cx="483.6" cy="81.0" r="3.2399999999999998" style="stroke:black;fill:black;stroke-width:1.3;" /></svg>